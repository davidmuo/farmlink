# Frontend hosting on Netlify (mirrors frontend/vercel.json)

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://farmlink-2co1.onrender.com"
  NODE_VERSION = "20"

# Code, media and fonts from an older deploy that no longer exist get a real 404. Without
# these, the single-page rule below would answer with index.html (HTTP 200), and a page still
# open from the older deploy would try to run that HTML as code and crash.
[[redirects]]
  from   = "/assets/*"
  to     = "/404.html"
  status = 404

[[redirects]]
  from   = "/media/*"
  to     = "/404.html"
  status = 404

[[redirects]]
  from   = "/fonts/*"
  to     = "/404.html"
  status = 404

# Single-page app: every route serves index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Content-hashed files never change
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
