<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A1C14" />
    <meta name="description" content="FarmLink connects verified Nigerian farmers directly with hotels, restaurants, schools and NGOs. Post what you need and get committed supply, with no middlemen." />
    <title>FarmLink | Fresh Produce Marketplace</title>
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <style>
      /* Homepage boot shell: the hero backdrop paints straight from HTML, before any JS.
         React replaces it with the identical hero on first render. */
      /* System font: the empty-alt image would otherwise make the browser fetch the app font early */
      #boot { display: none; font-family: sans-serif; }
      html[data-boot='home'] #boot { display: block; position: absolute; top: 0; left: 0; right: 0; height: 100vh; height: 100svh; min-height: 600px; background: #0A1C14; overflow: hidden; }
      #boot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #boot::after { content: ''; position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(10,28,20,.55) 0%, rgba(10,28,20,.1) 38%, rgba(10,28,20,.15) 58%, rgba(10,28,20,.78) 100%); }
    </style>
    <script>
      // Start the homepage hero poster (the largest thing on screen) before any JS loads.
      // Keep the paths and the size rule in sync with VIDEOS.hero in src/lib/media.ts and src/lib/net.ts.
      (function () {
        if (location.pathname !== '/') return;
        var c = navigator.connection || {};
        var small = window.innerWidth < 768 || c.saveData || (c.effectiveType && c.effectiveType !== '4g');
        window.__heroPoster = small ? '/media/hero-poster-sm.f1e6703c.webp' : '/media/hero-poster-lg.7a8abc23.webp';
        document.documentElement.setAttribute('data-boot', 'home');
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.href = window.__heroPoster;
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
        // The headline typeface; keep the path in sync with the @font-face in src/index.css
        var f = document.createElement('link');
        f.rel = 'preload';
        f.as = 'font';
        f.type = 'font/woff2';
        f.crossOrigin = 'anonymous';
        f.href = '/fonts/host-grotesk-var.62cd6b66.woff2';
        document.head.appendChild(f);
      })();
    </script>
  </head>
  <body>
    <div id="root"><div id="boot" aria-hidden="true"><img id="boot-img" alt="" /></div></div>
    <script>if (window.__heroPoster) document.getElementById('boot-img').src = window.__heroPoster;</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
